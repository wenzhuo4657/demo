dingsphere.rules.sharding.sharding-algorithms.alg_inline_userid.type=INLINEspring.shardingsphere.rules.sharding.sharding-algorithms.alg_inline_userid.props.algorithm-expression=mysql-Order$->{user_id % 2}spring.shardingsphere.rules.sharding.sharding-algorithms.alg_mod.type=MODspring.shardingsphere.rules.sharding.sharding-algorithms.alg_mod.props.sharding-count=2spring.shardingsphere.rules.sharding.tables.t_order.table-strategy.standard.sharding-column=order_nospring.shardingsphere.rules.sharding.tables.t_order.table-strategy.standard.sharding-algorithm-name=alg_hash_modspring.shardingsphere.rules.sharding.sharding-algorithms.alg_hash_mod.type=HASH_MODspring.shardingsphere.rules.sharding.sharding-algorithms.alg_hash_mod.props.sharding-count=2spring.shardingsphere.rules.sharding.tables.t_order.key-generate-strategy.column=idspring.shardingsphere.rules.sharding.tables.t_order.key-generate-strategy.key-generator-name=alg_snowflakespring.shardingsphere.rules.sharding.key-generators.alg_snowflake.type=SNOWFLAKE